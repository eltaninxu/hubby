{% extends "base.html" %}
{% block title %}Hubby · chat{% endblock %}
{% block content %}
<div class="layout">
  <section class="chat">
    <div class="messages" id="messages">
      <div class="msg hubby">
        <div class="bubble">Ask me before you buy. I'll check the house rules and release the money from the pot if it's a yes.</div>
      </div>
    </div>
    <form class="composer" id="composer">
      <input id="text" name="text" placeholder='try "fried chicken drumstick $6"' autocomplete="off" autofocus>
      <button type="submit" id="send">Send</button>
    </form>
  </section>

  <aside class="sidebar">
    {% include "_sidepanel.html" %}
  </aside>
</div>
{% endblock %}
{% block scripts %}<script src="/static/chat.js"></script>{% endblock %}
